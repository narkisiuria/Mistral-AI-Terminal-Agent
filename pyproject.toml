[project]
name = "terminal-ai-agent"
version = "2.0.0"
description = "AI agent controlling a live PowerShell session"
requires-python = ">=3.10"
dependencies = [
    "mistralai",
    "python-dotenv",
]

[project.scripts]
jarvis = "terminal_ai_agent.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["terminal_ai_agent"]